<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Center – Quản lý học sinh</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f6fa;--card:#fff;--ink:#0b2a3f;--mut:#5d7487;--line:#e2ebf1;--navy:#06304a;--blue:#00aeef;--or:#f7941d;--red:#ef3e36;--grn:#0a8a4f;--tint:#e8f6fd;--wk:#fff1f0;--tdy:#e3f4fd;--sum:#fff8e1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a1822;--card:#11293a;--ink:#e6f1f8;--mut:#8fa8ba;--line:#1d3a4f;--tint:#143a52;--wk:#2b1c24;--tdy:#10405c;--sum:#2e2a14;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 'Be Vietnam Pro',system-ui,sans-serif}
.top{background:linear-gradient(135deg,#06304a,#0a5578);color:#fff;border-bottom:4px solid var(--or)}
.w{max-width:1180px;margin:0 auto;padding:0 16px}
.bar{display:flex;align-items:center;gap:12px;padding:12px 0 6px}
.logo{height:54px;background:#fff;border-radius:12px;padding:3px 6px}
.bar h1{font-size:18px;margin:0;font-weight:800}.bar small{opacity:.8;font-style:italic;font-size:11.5px}
.usr{margin-left:auto;display:flex;gap:8px;align-items:center;font-weight:600}
.av{width:30px;height:30px;border-radius:50%;background:var(--or);display:grid;place-items:center;font-weight:800;color:#3a2100}
nav{display:flex;gap:4px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
nav a{color:#d6eaf5;text-decoration:none;padding:8px 13px;border-radius:999px;white-space:nowrap;font-weight:600;font-size:13px}
nav a.on{background:#fff;color:var(--navy)}nav a:hover:not(.on){background:#ffffff22}
.sel{background:var(--card);border-bottom:1px solid var(--line)}.sel .w{display:flex;gap:14px;flex-wrap:wrap;padding:10px 16px;align-items:center}
label.l{font-size:11px;font-weight:700;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
select,input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-width:100%}
textarea{width:100%;resize:vertical}main{padding:22px 0 30px}
h2{margin:0;font-size:22px;font-weight:800;display:flex;gap:12px;align-items:center}h2 i{font-style:normal;background:var(--tint);width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px}
.sub{color:var(--mut);margin:4px 0 16px 54px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 2px 10px #06304a0d;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.g2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:820px){.g2,.g3{grid-template-columns:1fr}.sub{margin-left:0}}
.st b{display:block;font-size:30px;font-weight:800;line-height:1.1}.st span{font-size:11px;font-weight:700;color:var(--mut);letter-spacing:.06em}
.btn{border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--blue);color:#fff}.btn.o{background:var(--or);color:#3a2100}.btn.g{background:var(--tint);color:var(--ink)}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--tint);font-size:12px;font-weight:600;margin:2px}
.ok{background:#d7f5e6;color:var(--grn);padding:6px 14px;border-radius:999px;font-weight:700;font-size:13px;margin-left:auto}
.sc{overflow:auto;max-height:62vh;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%}th,td{border:1px solid var(--line);text-align:center;padding:0;min-width:40px;height:38px;font-size:12px}
th{position:sticky;top:0;background:var(--card);z-index:2}td.n,th.n{position:sticky;left:0;background:var(--card);z-index:1;text-align:left;padding:0 10px;min-width:170px;white-space:nowrap;z-index:3}
.we{background:var(--wk)}.td{background:var(--tdy)}th.td{background:var(--blue);color:#fff}.sum td{background:var(--sum);font-weight:700;color:#8a5a00}
.ck{width:26px;height:26px;border-radius:8px;background:#e9eff3;border:0;cursor:pointer;color:transparent;font-weight:800}.ck.y{background:#d7f5e6;color:#0a8a4f;font-size:16px}.ck.x{background:transparent;border:2.5px solid #ef3e36;border-radius:50%;color:#ef3e36;font-size:12px;line-height:1}
.wi{width:100%;height:36px;border:0;text-align:center;background:transparent;border-radius:0;padding:0}.wi:focus{background:var(--tint);outline:2px solid var(--blue)}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row .f{flex:1}
.ini{width:34px;height:34px;border-radius:50%;background:var(--tint);display:grid;place-items:center;font-weight:800;color:var(--blue)}
.pt{border:1px solid #f7c97a;background:#fff5de;color:#8a5a00;border-radius:10px;padding:5px 11px;font-weight:700;cursor:pointer}
.ban{background:linear-gradient(135deg,#06304a,#0a5578);border-radius:18px;padding:20px;color:#fff;margin-bottom:16px}.ban .win{display:inline-block;background:linear-gradient(135deg,#ffc933,#ff8a0d);color:#3a2100;border-radius:14px;padding:14px 20px;margin-top:8px}
.pod{display:flex;gap:10px;align-items:flex-end;justify-content:center;height:210px}.pod div{flex:0 1 130px;text-align:center;font-weight:700}.pod .b{border-radius:12px 12px 0 0;margin-top:6px;display:grid;place-items:center;font-size:28px;font-weight:800;color:#fff}
.wh{display:grid;place-items:center;position:relative}.wh:before{content:"";position:absolute;top:-4px;z-index:2;border:13px solid transparent;border-top:22px solid var(--red);border-bottom:0}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;display:block}
.login{position:fixed;inset:0;background:linear-gradient(135deg,#06304a,#0a7aa8);display:grid;place-items:center;z-index:50;padding:16px}.login .card{width:100%;max-width:380px;text-align:center;padding:28px}.login input{width:100%;margin:6px 0}
.foot{border-top:4px solid var(--or);background:var(--card);padding:18px 0;color:var(--mut);font-size:13px}.foot .w{display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.em{color:var(--mut);text-align:center;padding:30px}.del{border:0;background:none;cursor:pointer;color:var(--mut);font-size:15px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}@media(max-width:820px){.g4{grid-template-columns:1fr 1fr}}
.mb{background:var(--tint);color:var(--ink)}.mb.p.on{background:#12b76a;color:#fff}.mb.a.on{background:var(--red);color:#fff}
.lv{display:flex;gap:6px;flex-wrap:wrap}.lb{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.lb.l3.on{background:#12b76a;border-color:#12b76a;color:#fff}.lb.l2.on{background:var(--blue);border-color:var(--blue);color:#fff}.lb.l1.on{background:var(--or);border-color:var(--or);color:#3a2100}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}@media(max-width:820px){.g5{grid-template-columns:1fr 1fr}}
.lb.l4.on{background:#7c3aed;border-color:#7c3aed;color:#fff}
.bd{display:inline-block;border-radius:6px;padding:1px 7px;color:#fff;font-weight:800;font-size:11.5px;margin:1px}
.st b span{font-size:inherit;letter-spacing:0}.st .bd{font-size:11.5px;color:#fff;letter-spacing:0}
.ls th,.ls td{padding:8px 10px;height:auto;text-align:left;min-width:0;vertical-align:top}.ls th.n,.ls td.n{min-width:170px}.ls tr[data-a]{cursor:pointer}.ls tr.on td{background:var(--tint)}
.mdl{position:fixed;inset:0;background:#0b2a3f99;display:grid;place-items:center;z-index:60;padding:16px;overflow:auto}.mdl .card{width:100%;max-width:620px;margin:0}
.subtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.sb{background:var(--card);color:var(--ink);border:1px solid var(--line)}.sb.on{background:var(--blue);color:#fff;border-color:var(--blue)}
</style></head><body><div id="app"></div>
